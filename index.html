<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>AI Typing Nexus</title>
    <style>
        :root { --neon: #00f3ff; --bg: #050505; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
        #container { text-align: center; border: 2px solid var(--neon); padding: 50px; border-radius: 20px; box-shadow: 0 0 30px rgba(0, 243, 255, 0.2); width: 80%; }
        #kanji { font-size: 3rem; margin-bottom: 10px; text-shadow: 0 0 10px var(--neon); }
        #romaji { font-size: 1.8rem; color: #444; letter-spacing: 2px; }
        .active { color: var(--neon); text-shadow: 0 0 5px var(--neon); }
        input { margin-top: 30px; background: transparent; border: 1px solid var(--neon); color: white; padding: 10px; width: 300px; border-radius: 5px; text-align: center; }
    </style>
</head>
<body>
    <div id="container">
        <div id="kanji">お題を入力して生成</div>
        <div id="romaji">waiting for AI...</div>
        <input type="text" id="topicInput" placeholder="例：猫の雑学、プログラミング名言" onkeypress="checkEnter(event)">
    </div>

    <script>
        const API_KEY = "YOUR_GEMINI_API_KEY"; // ここに取得したキーを貼る
        let targetRomaji = "";
        let currentIndex = 0;

        async function fetchAIWord() {
            const topic = document.getElementById('topicInput').value;
            document.getElementById('kanji').innerText = "AIが思考中...";
            
            const prompt = `${topic}について、タイピング練習用の短い一文を作って。返信は必ず「漢字,ローマ字」の形式だけで送って。例：猫は可愛い,nekohakawaii`;
            
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await response.json();
                const result = data.candidates[0].content.parts[0].text.trim().split(',');
                
                document.getElementById('kanji').innerText = result[0];
                targetRomaji = result[1].toLowerCase().replace(/[^a-z]/g, ""); // アルファベットのみ抽出
                currentIndex = 0;
                render();
            } catch (e) {
                document.getElementById('kanji').innerText = "エラー発生。キーを確認してね。";
            }
        }

        function render() {
            const typed = `<span class="active">${targetRomaji.substring(0, currentIndex)}</span>`;
            const untyped = targetRomaji.substring(currentIndex);
            document.getElementById('romaji').innerHTML = typed + untyped;
        }

        function checkEnter(e) { if (e.key === 'Enter') fetchAIWord(); }

        window.addEventListener('keydown', (e) => {
            if (targetRomaji && e.key === targetRomaji[currentIndex]) {
                currentIndex++;
                if (currentIndex === targetRomaji.length) {
                    document.getElementById('kanji').innerText = "素晴らしい！";
                    targetRomaji = "";
                }
                render();
            }
        });
    </script>
</body>
</html>
