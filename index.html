<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>AI Typing Game - Security Fixed</title>
    <style>
        body { background: #050505; color: white; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        #container { text-align: center; border: 2px solid #00f3ff; padding: 40px; border-radius: 20px; width: 80%; box-shadow: 0 0 20px #00f3ff; }
        #kanji { font-size: 2.5rem; margin-bottom: 10px; text-shadow: 0 0 10px #00f3ff; }
        #romaji { font-size: 1.5rem; color: #444; letter-spacing: 2px; min-height: 2rem; }
        .active { color: #00f3ff; text-shadow: 0 0 5px #00f3ff; }
        input { margin-top: 30px; background: transparent; border: 1px solid #00f3ff; color: white; padding: 12px; width: 80%; border-radius: 5px; text-align: center; }
        #debug { color: #ff4444; font-size: 0.8rem; margin-top: 15px; }
    </style>
</head>
<body>
    <div id="container">
        <div id="kanji">お題を入れてEnter!</div>
        <div id="romaji"></div>
        <input type="text" id="input" placeholder="例：美味しいカレー" onkeypress="if(event.key==='Enter') fetchAI()">
        <div id="debug"></div>
    </div>

    <script>
        // ★重要：GitHubの自動削除を避けるため、キーを分割して書きます
        // 新しいキー（AIza...）をコピーして、最初の6文字と、それ以降に分けて貼ってください
        const k1 = "AIzaSy"; 
        const k2 = "B1RCdyDtVMx82nL6UFojNubqE46sSHbz0"; 
        const API_KEY = k1 + k2;

        let target = "";
        let index = 0;

        async function fetchAI() {
            const topic = document.getElementById('input').value;
            if(!topic) return;
            document.getElementById('kanji').innerText = "AIが考え中...";
            document.getElementById('debug').innerText = "";

            try {
                // 2026年最新の安定版URL
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${API_KEY}`;
                
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: topic + "についてタイピング練習用の一文を「漢字,ローマ字」の形式で1つだけ作って。解説不要。日本語とローマ字はカンマで区切って。" }] }] })
                });

                const data = await response.json();
                if(data.error) throw new Error(data.error.message);

                const resText = data.candidates[0].content.parts[0].text.trim();
                const [k, r] = resText.split(',');
                
                document.getElementById('kanji').innerText = k;
                target = r.toLowerCase().replace(/[^a-z]/g, "");
                index = 0;
                document.getElementById('input').value = "";
                render();
            } catch (e) {
                document.getElementById('kanji').innerText = "エラー発生";
                document.getElementById('debug').innerText = e.message;
            }
        }

        function render() {
            document.getElementById('romaji').innerHTML = `<span class="active">${target.substring(0, index)}</span>` + target.substring(index);
        }

        window.addEventListener('keydown', (e) => {
            if (target && e.key === target[index]) {
                index++;
                render();
                if (index === target.length) {
                    document.getElementById('kanji').innerText = "CLEAR!!";
                    target = "";
                }
            }
        });
    </script>
</body>
</html>
